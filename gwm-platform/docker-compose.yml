version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gwm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gwm
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gwm
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
